- type: elasticsearch.query
  id: attacker.foothold.dnsmasq.traceroute
  labels:
    - traceroute
    - foothold
  description: >-
    This rule simply matches all PTR queries and answers that are made by traceroute.
  filter:
    bool:
      should:
        - range:
            "@timestamp":
              gte: "2022-02-08T07:07:11+00:00"
              lte: "2022-02-08T07:07:12+00:00"
  index:
    - dnsmasq-inet-firewall
  query:
    bool:
      # match answer or question field
      should:
        - regexp:
            message: '.*.in-addr.arpa from 10.237.1.238'
        - regexp:
            message: '.*forwarded.*.in-addr.arpa.*'

- type: elasticsearch.query
  id: attacker_foothold_dnsmasq_nmap_scan_parent_query
  labels:
    - network_scan
    - foothold
  description: >-
    This rule matches all PTR dns-queries from nmap local and DMZ scan.
  index:
    - dnsmasq-inet-firewall
  filter:
    bool:
      should:
        - range:
            "@timestamp":
              gte: "2022-02-08T07:16:45+00:00"
              lte: "2022-02-08T07:28:31+00:00"
        - range:
            "@timestamp":
              gte: "2022-02-08T07:07:21+00:00"
              lte: "2022-02-08T07:16:12+00:00"
  query:
    bool:
      should:
        - regexp:
            message: ".*.in-addr.arpa from 10.237.1.238"

- type: elasticsearch.sub_query
  id: attacker_foothold_dnsmasq_nmap_scan_sub_query
  labels:
    - network_scan
    - foothold
  description: >-
   This rule matches all answers for the already matched PTR requests that occur
   during the nmap DMZ scan.
  index:
    - dnsmasq-inet-firewall
  filter:
    bool:
      should:
        - range:
            "@timestamp":
              gte: "2022-02-08T07:16:45+00:00"
              lte: "2022-02-08T07:28:31+00:00"
        - range:
            "@timestamp":
              gte: "2022-02-08T07:07:21+00:00"
              lte: "2022-02-08T07:16:12+00:00"
  query:
    bool:
      should:
        - regexp:
            message: ".*.in-addr.arpa from 10.237.1.238"
  sub_query:
    index:
      - dnsmasq-inet-firewall
    filter:
      
      range:
        "@timestamp":
          gte: "{{ (( HIT['@timestamp'] | as_datetime) - timedelta(seconds=1)).isoformat() }}"
          lte: "{{ (( HIT['@timestamp'] | as_datetime) + timedelta(seconds=1)).isoformat() }}"
      
    query:
      bool:
        should:
          - regexp:
              message: '.*forwarded.*.in-addr.arpa.*'
          - regexp:
              message: '.*nameserver 127.0.0.1 refused to do a recursive query.*'
          - regexp:
              message: '.*reply.*mannsmith.harrison.com.*'

- type: elasticsearch.query
  id: attacker_foothold_dnsmasq_service_scan_parent_query
  labels:
    - service_scan
    - foothold
  description: >-
    This rule matches all PTR dns-queries from the nmap service scan.
  index:
    - dnsmasq-inet-firewall
  filter:
    range:
      "@timestamp":
        gte: "2022-02-08T07:16:19+00:00"
        lte: "2022-02-08T07:16:37+00:00"
  query:
    bool:
      should:
        - regexp:
            message: ".*.in-addr.arpa from 10.237.1.238"
        - regexp:
            message: ".*query.*from 10.237.2.255"
        - regexp:
            message: ".*query.*from 192.168.131.215"

- type: elasticsearch.sub_query
  id: attacker_foothold_dnsmasq_service_scan_sub_query
  labels:
    - service_scan
    - foothold
  description: >-
   This rule matches all answers of already matched PTR queries that occur during
   the nmap service scan.
  index:
    - dnsmasq-inet-firewall
  filter:
    range:
      "@timestamp":
        gte: "2022-02-08T07:16:19+00:00"
        lte: "2022-02-08T07:16:37+00:00"
  query:
    bool:
      should:
        - regexp:
            message: ".*.in-addr.arpa from 10.237.1.238"
        - regexp:
            message: ".*query.*from 10.237.2.255"
        - regexp:
            message: ".*query.*from 192.168.131.215"
  sub_query:
    index:
      - dnsmasq-inet-firewall
    filter:
      
      range:
        "@timestamp":
          gte: "{{ (( HIT['@timestamp'] | as_datetime) - timedelta(seconds=1)).isoformat() }}"
          lte: "{{ (( HIT['@timestamp'] | as_datetime) + timedelta(seconds=1)).isoformat() }}"
      
    query:
      bool:
        should:
          - regexp:
              message: '.*forwarded.*'
          - regexp:
              message: '.*nameserver 127.0.0.1 refused to do a recursive query.*'
          - regexp:
              message: '.*reply.*'
          - regexp:
              message: '.*cached.*'
        must_not:
          - script:
              script:
                id: "processed_harrison_scenario_kyoushi_label_filter"
                params:
                  labels: [dnsteal]


