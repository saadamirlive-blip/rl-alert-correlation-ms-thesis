  # we need the line number as tie breaker since openvpn logs
  # only have second precision
  tiebreaker_field: log.file.line
  max_span: 1m
  filter:
    range:
      "@timestamp":
        # escalation phase start
        gte: "2022-02-08T08:35:59+00:00"
        # escalation phase stop
        lte: "2022-02-08T08:37:28+00:00"
  sequences:
    - '[ openvpn where source.ip == "172.28.192.242" and source.user.name == "jthompson" ]'
    - '[ openvpn where openvpn.peer.duplicate == "jthompson" ]'
    - '[ openvpn where source.ip == "172.28.192.242" and source.user.name == "jthompson" and destination.ip != null ]'
