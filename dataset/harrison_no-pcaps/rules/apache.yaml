- type: elasticsearch.query
  id: attacker.service_scan
  labels: 
    - service_scan
    - foothold
  description: >-
    This rule labels apache logs relating to the Nmap service scan. The logs
    either have the Nmap user agent or no user agent at all.
  index:
    - apache_access-intranet_server
  query:
    bool:
      should:
        - match:
            user_agent.original: "Mozilla/5.0 (compatible; Nmap Scripting Engine; https://nmap.org/book/nse.html)"
        - bool:
            must_not:
              exists:
                field: "user_agent.original"
  filter:
    - range:
        "@timestamp":
          # service scan phase start
          gte: "2022-02-08T07:16:19+00:00"
          # service scan phase stop
          lte: "2022-02-08T07:16:37.465000+00:00"


- type: elasticsearch.sequence
  id: attacker.webshell.upload.seq
  labels: [webshell_upload]
  description: >-
    This rule labels the web shell upload step by matching the 3 step sequence
    within the foothold phase.
  index:
    - apache_access-intranet_server
  # since we do these requests very fast
  # we need the line number as tie breaker
  tiebreaker_field: log.file.line
  by: source.address
  max_span: 2m
  filter:
    range:
      "@timestamp":
        # foothold phase start
        gte: "2022-02-08T07:07:00+00:00"
        # foothold phase stop
        lte: "2022-02-08T07:56:38+00:00"
  sequences:
    - '[ apache where event.action == "access" and url.original == "/" ]'
    - '[ apache where event.action == "access" and url.original == "/?p=5" ]'
    - '[ apache where event.action == "access" and http.request.method == "POST" and url.original == "/wp-admin/admin-ajax.php" ]'


- type: elasticsearch.query
  id: attacker.escalate.webshell.cmd.http
  labels: [webshell_cmd]
  description: >-
    This rule matches the web shell web requests via the recorded
    web shell URI and web shell request params.
  index:
    - apache_access-intranet_server
  # we cannot use a time range filter for this one as
  # the log line does not have a timestamp
  query:
    # match the VPN server as source
    - match:
        source.address: '10.237.1.238'
    # match web shell URI without protocol
    - regexp:
        url.full: 'intranet.mannsmith.harrison.com/wp-content/uploads/2022/02/yumzrshbwn-1644306962.5811.php.*'
    # match any of the sent command params in the URI
    # Also URL encode the value parts
    - bool:
        should:

          # list_www
          # ls -l /var/www
          - regexp:
              url.original: ".*wp_meta=WyJscyIsICItbCIsICIvdmFyL3d3dyJd.*"

          # check_who
          # who
          - regexp:
              url.original: ".*wp_meta=WyJ3aG8iXQ%3D%3D.*"

          # read_passwd
          # cat /etc/passwd
          - regexp:
              url.original: ".*wp_meta=WyJjYXQiLCAiL2V0Yy9wYXNzd2QiXQ%3D%3D.*"

          # list_web_dir
          # ls -laR /var/www
          - regexp:
              url.original: ".*wp_meta=WyJscyIsICItbGFSIiwgIi92YXIvd3d3Il0%3D.*"

          # clear
          # clear
          - regexp:
              url.original: ".*wp_meta=WyJjbGVhciJd.*"

          # check_last
          # last
          - regexp:
              url.original: ".*wp_meta=WyJsYXN0Il0%3D.*"

          # read_group
          # cat /etc/group
          - regexp:
              url.original: ".*wp_meta=WyJjYXQiLCAiL2V0Yy9ncm91cCJd.*"

          # check_wp_config
          # cat /var/www/intranet.mannsmith.harrison.com/wp-config.php
          - regexp:
              url.original: ".*wp_meta=WyJjYXQiLCAiL3Zhci93d3cvaW50cmFuZXQubWFubnNtaXRoLmhhcnJpc29uLmNvbS93cC1jb25maWcucGhwIl0%3D.*"

          # dump_wp_users
          # mysql -u wordpress -ptainoox3aedeeSh wordpress_db -e "select * from wp_users"
          - regexp:
              url.original: ".*wp_meta=WyJteXNxbCIsICItdSIsICJ3b3JkcHJlc3MiLCAiLXB0YWlub294M2FlZGVlU2giLCAid29yZHByZXNzX2RiIiwgIi1lIiwgIlwic2VsZWN0ICogZnJvbSB3cF91c2Vyc1wiIl0%3D.*"

          # check_id
          # id
          - regexp:
              url.original: ".*wp_meta=WyJpZCJd.*"


- type: elasticsearch.query
  id: attacker.escalate.webshell.cmd.http_prepare_crack
  labels: 
    - webshell_cmd
    - escalate
  description: >-
    This rule matches the web shell web requests via the recorded
    web shell URI and commands 
  index:
    - apache_access-intranet_server
  # we cannot use a time range filter for this one as
  # the log line does not have a timestamp
  query:
    # match the VPN server as source
    - match:
        source.address: '10.237.1.238'
    # match web shell URI without protocol
    - regexp:
        url.full: 'intranet.mannsmith.harrison.com/wp-content/uploads/2022/02/yumzrshbwn-1644306962.5811.php.*'
    # match any of the sent command params in the URI
    # Also URL encode the value parts
    - bool:
        should:
          - regexp:
              url.original: ".*WyJ3Z2V0IiwgImh0dHBzOi8vZ2l0aHViLmNvbS9haXQtYWVjaWQvd3BoYXNoY3JhY2svYXJjaGl2ZS9yZWZzL3RhZ3MvdjAuMS50YXIuZ3oiXQ.*"
          - regexp:
              url.original: ".*WyJ0YXIiLCAieHZmeiIsICJ2MC4xLnRhci5neiJd.*"
          - regexp:
              url.original: ".*WyJ3Z2V0I.*"
          - regexp:
              url.original: ".*WyIuL3dwaGFzaGNyYWNrLTAuMS93cGhhc2hjcmFjay5zaCIsICItdyIsICIkUFdEL3JvY2t5b3UudHh0IiwgIi1qIiwgIi4vd3BoYXNoY3JhY2stMC4xL2pvaG4tMS43LjYtanVtYm8tMTItTGludXg2NC9ydW4iLCAiLXUi.*"

